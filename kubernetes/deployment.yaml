apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: moeraspolozenie-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: andrejgockov/moeraspolozenie:latest
          ports:
            - containerPort: 80
          envFrom:
            - secretRef:
                name: app-secrets